name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; const version = JSON.parse(fs.readFileSync('package.json')).version; if (process.env.RELEASE_TAG !== 'v' + version) throw new Error('Tag and package version differ');"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: HIVEM1ND-Windows
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tgz
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: HIVEM1ND-Windows
          path: dist
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          text = pathlib.Path('CHANGELOG.md').read_text()
          match = re.search(r'^## ' + re.escape(version) + r'[^\n]*\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          if match is None:
              raise SystemExit('Missing changelog entry for release tag')
          pathlib.Path('release-notes.md').write_text(match.group(1).strip() + '\n')
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "${RELEASE_TAG#v}" --notes-file release-notes.md
