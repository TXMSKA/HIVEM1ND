name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; const version = JSON.parse(fs.readFileSync('package.json')).version; if (process.env.RELEASE_TAG !== 'v' + version) throw new Error('Tag and package version differ');"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The installer bundles the pinned official Node runtime and checks its SHA-256 itself before building.
      - name: Fetch the pinned Node runtime
        shell: pwsh
        run: Invoke-WebRequest -Uri https://nodejs.org/dist/v22.23.3/node-v22.23.3-win-x64.zip -OutFile "$env:RUNNER_TEMP/node-v22.23.3-win-x64.zip"
      - run: npm run dist:win -- --node-zip "${{ runner.temp }}/node-v22.23.3-win-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HIVEM1ND-Windows
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tgz
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: HIVEM1ND-Windows
          path: dist
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          text = pathlib.Path('CHANGELOG.md').read_text()
          match = re.search(r'^## ' + re.escape(version) + r'[^\n]*\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          if match is None:
              raise SystemExit('Missing changelog entry for release tag')
          pathlib.Path('release-notes.md').write_text(match.group(1).strip() + '\n')
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "${RELEASE_TAG#v}" --notes-file release-notes.md
