appId: com.txmska.hivem1nd # Compatibility: preserve the installed Electron application identity.
productName: ONEM1ND
copyright: Copyright (c) 2026 TXMSKA
asar: false # The registered Node service needs real CLI files and a real working directory.
extraMetadata:
  main: gui/electron.mjs
directories:
  output: dist
files:
  - gui/**
  - engine/**
  - cli/**
  - roles/**
  - commands/**
  - features/**
  - knowledge/**
  - migrations/**
  - fixtures/**
  - assets/**
  - rules.md
  - files.md
  - uninstall.cmd
  - README.md
  - LICENSE
  - CONTRIBUTING.md
  - CHANGELOG.md
  - package.json
  - '!**/test/**'
win:
  icon: assets/installer.ico
  target:
    - target: dir
      arch:
        - x64
  artifactName: ONEM1ND-${version}-${arch}.${ext}
